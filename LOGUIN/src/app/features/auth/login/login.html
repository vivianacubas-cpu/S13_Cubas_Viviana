<div class="login-page">
  <section class="login-card">
    <a class="login-brand" href="/login"><span class="brand-mark">B</span><span><strong>Biblioteca</strong><small>CENTRAL</small></span></a>
    <div class="eyebrow">BIENVENIDA</div>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Ingresa tus datos para acceder al panel de gestión.</p>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="usuario@ejemplo.com" autocomplete="username" required email>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>

      @if (errorMessage) {
        <div class="error-message" role="alert">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="loginForm.invalid">Ingresar al Dashboard</button>
    </form>
    <div class="demo-credentials"><strong>Credenciales de prueba</strong><span>admin@biblioteca.com</span><span>Contraseña: 123456</span></div>
    <p class="login-footer">© 2026 Biblioteca Central</p>
  </section>
</div>
